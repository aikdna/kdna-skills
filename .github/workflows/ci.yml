name: CI
on: [pull_request, push]
jobs:
  mcp-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 22.23.1]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: node --version | grep -Fx "v${{ matrix.node }}"
      - run: npm ci --ignore-scripts
      - run: npm test
  lint-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck install.sh install-cli.sh
  agent-support:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          check-latest: false
      - run: node --version | grep -Fx v22.23.1
      - run: node scripts/validate-agent-support.js
      - run: node --test scripts/test-validate-agent-support.mjs
      - run: node scripts/validate-creation-agent.js
